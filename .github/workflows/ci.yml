name: CI

on:
  push:
  pull_request:

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  no-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run test:ci:no-browser

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx playwright install --with-deps
      - run: npm run test:ci:browser
      - name: Upload hosted demo evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-demo-evidence
          path: test-results/hosted-demo-evidence
