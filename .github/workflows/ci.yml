name: CI

on:
  push:
  pull_request:

jobs:
  no-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:ci:no-browser

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run test:ci:browser
      - name: Upload hosted demo evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-demo-evidence
          path: test-results/hosted-demo-evidence
