name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  no-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run no-browser gate with lock-evidence log
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs"
          npm run test:ci:no-browser 2>&1 | tee "$RUNNER_TEMP/lock-evidence-input/logs/no-browser.log"
      - name: Upload no-browser lock evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: no-browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs/no-browser.log

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx playwright install --with-deps
      - name: Run browser gate with lock-evidence log
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs"
          mkdir -p "$RUNNER_TEMP/hosted-demo-evidence"
          HOSTED_DEMO_EVIDENCE_DIR="$RUNNER_TEMP/hosted-demo-evidence" PLAYWRIGHT_SKIP_INSTALL=1 npm run test:ci:browser 2>&1 | tee "$RUNNER_TEMP/lock-evidence-input/logs/browser.log"
      - name: Upload hosted demo evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hosted-demo-evidence
          path: ${{ runner.temp }}/hosted-demo-evidence
      - name: Upload browser lock evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs/browser.log

  lock-evidence-bundle:
    runs-on: ubuntu-latest
    needs: [no-browser, browser]
    if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Download no-browser lock evidence log
        uses: actions/download-artifact@v6
        with:
          name: no-browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download browser lock evidence log
        uses: actions/download-artifact@v6
        with:
          name: browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download hosted demo evidence
        uses: actions/download-artifact@v6
        with:
          name: hosted-demo-evidence
          path: ${{ runner.temp }}/hosted-demo-evidence
      - name: Build canonical lock evidence bundle
        env:
          LOCK_EVIDENCE_INPUT_DIR: ${{ runner.temp }}/lock-evidence-input
          HOSTED_DEMO_EVIDENCE_DIR: ${{ runner.temp }}/hosted-demo-evidence
          LOCK_EVIDENCE_BUNDLE_DIR: ${{ runner.temp }}/lock-evidence-bundle
        run: node scripts/build-lock-evidence-bundle.mjs
      - name: Upload canonical lock evidence bundle
        uses: actions/upload-artifact@v6
        with:
          name: lock-evidence-bundle_1.1.0-rc.2-fix.1_${{ github.run_id }}
          path: ${{ runner.temp }}/lock-evidence-bundle/lock-evidence-bundle_1.1.0-rc.2-fix.1_${{ github.run_id }}
