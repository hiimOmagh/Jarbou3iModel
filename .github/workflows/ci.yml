name: CI
run-name: v1.3.0-rc.1 source-to-claim gap closure — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  no-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run no-browser gate with lock-evidence log
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/lock-evidence-input" "$RUNNER_TEMP/lock-evidence-bundle"
          rm -rf "$GITHUB_WORKSPACE/ci-artifacts"
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs"
          set +e
          npm run test:ci:no-browser > "$RUNNER_TEMP/lock-evidence-input/logs/no-browser.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/lock-evidence-input/logs/no-browser.log"
          exit $status
      - name: Upload no-browser lock evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: no-browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs/no-browser.log

  browser:
    runs-on: ubuntu-latest
    needs: no-browser
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npx playwright install --with-deps
      - name: Run browser gate with lock-evidence log
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/lock-evidence-input" "$RUNNER_TEMP/hosted-demo-evidence" "$RUNNER_TEMP/lock-evidence-bundle"
          rm -rf "$GITHUB_WORKSPACE/ci-artifacts"
          rm -rf "$GITHUB_WORKSPACE/test-results/hosted-demo-evidence"
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs" "$RUNNER_TEMP/hosted-demo-evidence"
          set +e
          HOSTED_DEMO_EVIDENCE_DIR="$RUNNER_TEMP/hosted-demo-evidence" PLAYWRIGHT_SKIP_INSTALL=1 npm run test:ci:browser > "$RUNNER_TEMP/lock-evidence-input/logs/browser.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/lock-evidence-input/logs/browser.log"
          if [ $status -ne 0 ]; then
            exit $status
          fi
          test -f "$RUNNER_TEMP/hosted-demo-evidence/matrix-summary.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/hosted-demo-evidence/matrix-summary.json';
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (summary.internal_build_version !== '1.3.0-rc.1') throw new Error(`matrix version mismatch: ${summary.internal_build_version}`);
          if (summary.expected_rows !== 39 || summary.actual_rows !== 39 || summary.passed_rows !== 39 || summary.failed_rows !== 0) throw new Error(`matrix rows invalid: ${JSON.stringify({expected:summary.expected_rows, actual:summary.actual_rows, passed:summary.passed_rows, failed:summary.failed_rows})}`);
          if (summary.language_purity_passed !== true || summary.visual_guard_passed !== true || summary.stale_version_residue_detected !== false) throw new Error('matrix summary release guards failed');
          NODE
      - name: Upload hosted demo evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hosted-demo-evidence
          path: ${{ runner.temp }}/hosted-demo-evidence
      - name: Upload browser lock evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs/browser.log

  lock-evidence-bundle:
    runs-on: ubuntu-latest
    needs: [no-browser, browser]
    timeout-minutes: 15
    if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Download no-browser lock evidence log
        uses: actions/download-artifact@v6
        with:
          name: no-browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download browser lock evidence log
        uses: actions/download-artifact@v6
        with:
          name: browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download hosted demo evidence
        uses: actions/download-artifact@v6
        with:
          name: hosted-demo-evidence
          path: ${{ runner.temp }}/hosted-demo-evidence
      - name: Build canonical lock evidence bundle
        env:
          LOCK_EVIDENCE_INPUT_DIR: ${{ runner.temp }}/lock-evidence-input
          HOSTED_DEMO_EVIDENCE_DIR: ${{ runner.temp }}/hosted-demo-evidence
          LOCK_EVIDENCE_BUNDLE_DIR: ${{ runner.temp }}/lock-evidence-bundle
        run: node scripts/build-lock-evidence-bundle.mjs
      - name: Upload canonical lock evidence bundle
        uses: actions/upload-artifact@v6
        with:
          name: lock-evidence-bundle_1.3.0-rc.1_${{ github.run_id }}
          path: ${{ runner.temp }}/lock-evidence-bundle/lock-evidence-bundle_1.3.0-rc.1_${{ github.run_id }}
