name: CI
run-name: v1.4.0-alpha.36 Adapter Replay Review Pack Operator Review Console — ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  no-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run no-browser gate with lock-evidence log
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/lock-evidence-input" "$RUNNER_TEMP/lock-evidence-bundle"
          rm -rf "$GITHUB_WORKSPACE/ci-artifacts"
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs"
          cat > "$RUNNER_TEMP/lock-evidence-input/logs/no-browser-lock-evidence-log.identity.json" <<EOF
          {
            "app_version": "1.4.0-alpha.36",
            "run_id": "${GITHUB_RUN_ID}",
            "git_sha": "${GITHUB_SHA}",
            "job_name": "no-browser",
            "artifact_kind": "no-browser-lock-evidence-log",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref_name": "${GITHUB_REF_NAME}"
          }
          EOF
          set +e
          npm run test:ci:no-browser > "$RUNNER_TEMP/lock-evidence-input/logs/no-browser.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/lock-evidence-input/logs/no-browser.log"
          exit $status
      - name: Upload no-browser lock evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: no-browser-lock-evidence-log
          path: |
            ${{ runner.temp }}/lock-evidence-input/logs/no-browser.log
            ${{ runner.temp }}/lock-evidence-input/logs/no-browser-lock-evidence-log.identity.json

  browser:
    runs-on: ubuntu-latest
    needs: no-browser
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate public npm lockfile
        run: node tests/lockfile-public-registry-check.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Initialize browser lock evidence workspace
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/lock-evidence-input" "$RUNNER_TEMP/hosted-demo-evidence" "$RUNNER_TEMP/lock-evidence-bundle"
          rm -rf "$GITHUB_WORKSPACE/ci-artifacts"
          rm -rf "$GITHUB_WORKSPACE/test-results/hosted-demo-evidence"
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs" "$RUNNER_TEMP/hosted-demo-evidence"
          for artifact_kind in playwright-install-deps-log playwright-install-log browser-lock-evidence-log; do
            case "$artifact_kind" in
              playwright-install-deps-log) job_name="browser" ;;
              playwright-install-log) job_name="browser" ;;
              browser-lock-evidence-log) job_name="browser" ;;
            esac
            cat > "$RUNNER_TEMP/lock-evidence-input/logs/${artifact_kind}.identity.json" <<EOF
          {
            "app_version": "1.4.0-alpha.36",
            "run_id": "${GITHUB_RUN_ID}",
            "git_sha": "${GITHUB_SHA}",
            "job_name": "${job_name}",
            "artifact_kind": "${artifact_kind}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref_name": "${GITHUB_REF_NAME}"
          }
          EOF
          done
          cat > "$RUNNER_TEMP/hosted-demo-evidence/hosted-demo-evidence.identity.json" <<EOF
          {
            "app_version": "1.4.0-alpha.36",
            "run_id": "${GITHUB_RUN_ID}",
            "git_sha": "${GITHUB_SHA}",
            "job_name": "browser",
            "artifact_kind": "hosted-demo-evidence",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref_name": "${GITHUB_REF_NAME}"
          }
          EOF
          printf 'Browser gate pending: Playwright install has not completed yet.\n' > "$RUNNER_TEMP/lock-evidence-input/logs/browser.log"
          printf 'Playwright system dependency install pending.\n' > "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install-deps.log"
          printf 'Playwright browser binary install pending.\n' > "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log"
      - name: Resolve Playwright cache key
        id: playwright-cache-key
        shell: bash
        run: |
          version="$(node -e "const lock=require('./package-lock.json'); const packages=lock.packages||{}; const version=packages['node_modules/playwright']?.version || packages['node_modules/@playwright/test']?.version || lock.dependencies?.playwright?.version || lock.dependencies?.['@playwright/test']?.version || 'unknown'; process.stdout.write(version);")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright cache version: $version"
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright-cache-key.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-${{ steps.playwright-cache-key.outputs.version }}-
            ${{ runner.os }}-ms-playwright-
      - name: Install Playwright system dependencies with evidence log
        shell: bash
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs"
          printf 'Playwright install-deps started: timeout 10m npx playwright install-deps chromium\n' > "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install-deps.log"
          set +e
          timeout 10m npx playwright install-deps chromium >> "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install-deps.log" 2>&1
          status=$?
          if [ "$status" -eq 124 ]; then
            printf '\nPlaywright install-deps timed out after 10 minutes.\n' >> "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install-deps.log"
          fi
          cat "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install-deps.log"
          exit $status
      - name: Upload Playwright install-deps evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-install-deps-log
          path: |
            ${{ runner.temp }}/lock-evidence-input/logs/playwright-install-deps.log
            ${{ runner.temp }}/lock-evidence-input/logs/playwright-install-deps-log.identity.json
      - name: Install Playwright browser with evidence log
        shell: bash
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs"
          printf 'Playwright browser install started: timeout 8m npx playwright install chromium\n' > "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log"
          set +e
          timeout 8m npx playwright install chromium >> "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log" 2>&1
          status=$?
          if [ "$status" -eq 124 ]; then
            printf '\nPlaywright browser install attempt 1 timed out after 8 minutes.\n' >> "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log"
          fi
          if [ "$status" -ne 0 ]; then
            printf '\nPlaywright browser install attempt 1 failed with status %s; retrying once after 15 seconds.\n' "$status" >> "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log"
            sleep 15
            timeout 8m npx playwright install chromium >> "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log" 2>&1
            status=$?
            if [ "$status" -eq 124 ]; then
              printf '\nPlaywright browser install attempt 2 timed out after 8 minutes.\n' >> "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log"
            fi
          fi
          cat "$RUNNER_TEMP/lock-evidence-input/logs/playwright-install.log"
          exit $status
      - name: Upload Playwright install evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-install-log
          path: |
            ${{ runner.temp }}/lock-evidence-input/logs/playwright-install.log
            ${{ runner.temp }}/lock-evidence-input/logs/playwright-install-log.identity.json
      - name: Run browser gate with lock-evidence log
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lock-evidence-input/logs" "$RUNNER_TEMP/hosted-demo-evidence"
          printf '\nBrowser gate started: HOSTED_DEMO_EVIDENCE_DIR with PLAYWRIGHT_SKIP_INSTALL=1 npm run test:ci:browser\n' >> "$RUNNER_TEMP/lock-evidence-input/logs/browser.log"
          set +e
          HOSTED_DEMO_EVIDENCE_DIR="$RUNNER_TEMP/hosted-demo-evidence" PLAYWRIGHT_SKIP_INSTALL=1 npm run test:ci:browser >> "$RUNNER_TEMP/lock-evidence-input/logs/browser.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/lock-evidence-input/logs/browser.log"
          if [ $status -ne 0 ]; then
            exit $status
          fi
          test -f "$RUNNER_TEMP/hosted-demo-evidence/matrix-summary.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.RUNNER_TEMP + '/hosted-demo-evidence/matrix-summary.json';
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (summary.internal_build_version !== '1.4.0-alpha.36') throw new Error(`matrix version mismatch: ${summary.internal_build_version}`);
          if (summary.expected_rows !== 39 || summary.actual_rows !== 39 || summary.passed_rows !== 39 || summary.failed_rows !== 0) throw new Error(`matrix rows invalid: ${JSON.stringify({expected:summary.expected_rows, actual:summary.actual_rows, passed:summary.passed_rows, failed:summary.failed_rows})}`);
          if (summary.language_purity_passed !== true || summary.visual_guard_passed !== true || summary.stale_version_residue_detected !== false) throw new Error('matrix summary release guards failed');
          NODE
      - name: Upload hosted demo evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hosted-demo-evidence
          path: ${{ runner.temp }}/hosted-demo-evidence
      - name: Upload browser lock evidence log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-lock-evidence-log
          path: |
            ${{ runner.temp }}/lock-evidence-input/logs/browser.log
            ${{ runner.temp }}/lock-evidence-input/logs/browser-lock-evidence-log.identity.json

  lock-evidence-bundle:
    runs-on: ubuntu-latest
    needs: [no-browser, browser]
    timeout-minutes: 15
    if: always()
    steps:
      - name: Write lock evidence bundle decision
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lock-evidence-bundle-diagnostic"
          cat > "$RUNNER_TEMP/lock-evidence-bundle-diagnostic/lock-evidence-bundle-decision.identity.json" <<EOF
          {
            "app_version": "1.4.0-alpha.36",
            "run_id": "${GITHUB_RUN_ID}",
            "git_sha": "${GITHUB_SHA}",
            "job_name": "lock-evidence-bundle",
            "artifact_kind": "lock-evidence-bundle-decision",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref_name": "${GITHUB_REF_NAME}"
          }
          EOF
          {
            echo "lock-evidence-bundle decision"
            echo "no-browser result: ${{ needs.no-browser.result }}"
            echo "browser result: ${{ needs.browser.result }}"
            echo "canonical bundle required: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}"
            echo "canonical bundle policy: upload only when no-browser and browser both pass"
          } > "$RUNNER_TEMP/lock-evidence-bundle-diagnostic/lock-evidence-bundle-decision.txt"
          cat "$RUNNER_TEMP/lock-evidence-bundle-diagnostic/lock-evidence-bundle-decision.txt"
      - name: Upload lock evidence bundle decision
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lock-evidence-bundle-decision
          path: ${{ runner.temp }}/lock-evidence-bundle-diagnostic
      - uses: actions/checkout@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Download no-browser lock evidence log
        uses: actions/download-artifact@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          name: no-browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download Playwright install-deps evidence log
        uses: actions/download-artifact@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          name: playwright-install-deps-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download Playwright install evidence log
        uses: actions/download-artifact@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          name: playwright-install-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download browser lock evidence log
        uses: actions/download-artifact@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          name: browser-lock-evidence-log
          path: ${{ runner.temp }}/lock-evidence-input/logs
      - name: Download hosted demo evidence
        uses: actions/download-artifact@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          name: hosted-demo-evidence
          path: ${{ runner.temp }}/hosted-demo-evidence
      - name: Build canonical lock evidence bundle
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        env:
          LOCK_EVIDENCE_INPUT_DIR: ${{ runner.temp }}/lock-evidence-input
          HOSTED_DEMO_EVIDENCE_DIR: ${{ runner.temp }}/hosted-demo-evidence
          LOCK_EVIDENCE_BUNDLE_DIR: ${{ runner.temp }}/lock-evidence-bundle
        run: node scripts/build-lock-evidence-bundle.mjs
      - name: Upload canonical lock evidence bundle
        uses: actions/upload-artifact@v6
        if: ${{ needs.no-browser.result == 'success' && needs.browser.result == 'success' }}
        with:
          name: lock-evidence-bundle_1.4.0-alpha.36_${{ github.run_id }}
          path: ${{ runner.temp }}/lock-evidence-bundle/lock-evidence-bundle_1.4.0-alpha.36_${{ github.run_id }}
